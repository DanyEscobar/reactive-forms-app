<h1 class="mt-3">Selectores anidados</h1>
<hr />

<form [formGroup]="myForm" (ngSubmit)="onSubmit()">
  <!-- Region -->
  <div class="row mb-3">
    <div class="col">
      <label class="form-label" for="region">Continente:</label>
      <select 
        id="region" 
        formControlName="region" 
        class="form-control"
      >
        <option value="">-- Seleccione Continente --</option>
        
        @for (region of regions(); track region) {
          <option [value]="region">
            {{ region }}
          </option>
        }
        
      </select>
    </div>
  </div>

  <!-- Countries -->

  <div class="row mb-3">
    <div class="col">
      <label class="form-label" for="country">País:</label>
      <select 
        id="country" 
        formControlName="country" 
        class="form-control"
      >
        <option value="">-- Seleccione País --</option>

        @for (country of countriesByRegion(); track country.cca3) {
          <option [value]="country.cca3">
            {{ country.name.common }}
          </option>
        }

      </select>
    </div>
  </div>


  <!-- Countries -->

  <div class="row mb-3">
    <div class="col">
      <label class="form-label" for="border">Fronteras:</label>
      <select 
        id="border" 
        formControlName="border" 
        class="form-control"
      >
        <option value="">-- Seleccione la frontera --</option>


        @for (border of borders(); track border.cca3) {
          <option [value]="border.cca3">
            {{ border.name.common }}
          </option>
        }
      </select>
    </div>
  </div>

</form>

<h3>Formulario</h3>
<code>
  {{ myForm.value | json }}
</code>
<p>is form valid: {{ myForm.valid | json }}</p>
